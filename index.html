<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>한국사 Pass Vault</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Pretendard", "system-ui", "sans-serif"] },
          colors: {
            brand: { 50: "#eef4ff", 100: "#dbe6ff", 500: "#3b5bdb", 600: "#2f4ac0", 700: "#243b98", 900: "#1e2a5a" },
          },
        },
      },
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    .toast-enter { animation: toast .25s ease-out; }
    @keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .fade-in { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
  <div class="mx-auto max-w-2xl min-h-screen flex flex-col">
    <header class="sticky top-0 z-20 bg-brand-900 text-white px-4 py-3 flex items-center justify-between shadow">
      <div class="flex items-center gap-2">
        <span class="text-xl" aria-hidden="true">🏛️</span>
        <h1 class="text-lg font-bold tracking-tight">한국사 Pass Vault</h1>
      </div>
      <span id="mode-badge" class="text-xs rounded-full px-2.5 py-1 bg-white/15">연결 중…</span>
    </header>

    <main id="main" class="flex-1 px-4 pt-4 pb-28">
      <div class="py-24 text-center text-slate-500">불러오는 중…</div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 z-20 bg-white border-t border-slate-200 pb-safe">
      <div class="mx-auto max-w-2xl grid grid-cols-3" id="tabs">
        <button data-action="tab" data-view="quiz" class="tab min-h-[56px] flex flex-col items-center justify-center gap-0.5 text-sm">
          <span class="text-lg" aria-hidden="true">📖</span>기출 퀴즈
        </button>
        <button data-action="tab" data-view="vault" class="tab min-h-[56px] flex flex-col items-center justify-center gap-0.5 text-sm relative">
          <span class="text-lg" aria-hidden="true">📝</span>오답노트
          <span id="vault-count" class="hidden absolute top-1.5 left-1/2 ml-3 min-w-[20px] h-5 px-1 rounded-full bg-rose-500 text-white text-[11px] font-bold leading-5"></span>
        </button>
        <button data-action="tab" data-view="stats" class="tab min-h-[56px] flex flex-col items-center justify-center gap-0.5 text-sm">
          <span class="text-lg" aria-hidden="true">📊</span>학습 현황
        </button>
      </div>
    </nav>
  </div>

  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/questions.js"></script>
  <!-- 고졸 검정고시 한국사 기출 (출처: 국가평생교육진흥원 검정고시지원센터) -->
  <script src="js/exams/2026-2.js"></script>
  <script src="js/exams/2026-1.js"></script>
  <script src="js/exams/2025-2.js"></script>
  <script src="js/exams/2025-1.js"></script>
  <script src="js/exams/2024-2.js"></script>
  <script src="js/exams/2024-1.js"></script>
  <script src="js/exams/2023-2.js"></script>
  <script src="js/exams/2023-1.js"></script>
  <script src="js/exams/2022-2.js"></script>
  <script src="js/exams/2022-1.js"></script>
  <script src="js/exams/2021-2.js"></script>
  <script src="js/exams/2021-1.js"></script>
  <script src="js/exams/2020-2.js"></script>
  <script src="js/exams/2020-1.js"></script>
  <script src="js/exams/2019-2.js"></script>
  <script src="js/exams/2019-1.js"></script>
  <script src="js/exams/2018-2.js"></script>
  <script src="js/exams/2018-1.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
