<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>검정고시 Pass Vault</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Pretendard", "system-ui", "sans-serif"] },
          colors: {
            brand: { 50: "#eef4ff", 100: "#dbe6ff", 500: "#3b5bdb", 600: "#2f4ac0", 700: "#243b98", 900: "#1e2a5a" },
          },
        },
      },
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    .toast-enter { animation: toast .25s ease-out; }
    @keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .fade-in { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
  <div class="mx-auto max-w-2xl min-h-screen flex flex-col">
    <header class="sticky top-0 z-20 bg-brand-900 text-white px-2 py-2 flex items-center justify-between shadow">
      <div class="flex items-center gap-1 min-w-0">
        <button id="back-btn" data-action="home" class="hidden min-h-[44px] min-w-[44px] rounded-lg text-sm font-semibold hover:bg-white/10 px-2" aria-label="과목 선택으로">‹ 과목</button>
        <span id="header-icon" class="text-xl pl-2" aria-hidden="true">📚</span>
        <h1 id="header-title" class="text-lg font-bold tracking-tight truncate">검정고시 Pass Vault</h1>
      </div>
      <span id="mode-badge" class="shrink-0 text-xs rounded-full px-2.5 py-1 mr-2 bg-white/15">연결 중…</span>
    </header>

    <main id="main" class="flex-1 px-4 pt-4 pb-28">
      <div class="py-24 text-center text-slate-500">불러오는 중…</div>
    </main>

    <nav id="nav" class="hidden fixed bottom-0 inset-x-0 z-20 bg-white border-t border-slate-200 pb-safe">
      <div class="mx-auto max-w-2xl grid" id="tabs"></div>
    </nav>
  </div>

  <div id="toast-root"></div>
